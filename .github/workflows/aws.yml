name: Create 20 S3 Buckets

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  PREFIX: farhat

jobs:
  create-buckets:
    runs-on: ubuntu-latest
    steps:
      - name: Debug OIDC subject (temporary)
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Ref: ${{ github.ref }}"
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+')
          while [ $(( ${#PAYLOAD} % 4 )) -ne 0 ]; do PAYLOAD="${PAYLOAD}="; done
          echo "$PAYLOAD" | base64 -d | jq '{sub, aud, iss}'

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::942849038148:role/github-actions-s3-role
          aws-region: us-east-1
          role-session-name: github-actions-s3
          retry-max-attempts: 1

      - name: Who am I
        run: aws sts get-caller-identity

      - name: Create 20 buckets (skip if they already exist)
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          for i in $(seq -w 1 20); do
            BUCKET="${PREFIX}-${ACCOUNT_ID}-${i}"

            if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
              echo "Bucket already exists, skipping: $BUCKET"
              continue
            fi

            echo "Creating bucket: $BUCKET"
            aws s3api create-bucket \
              --bucket "$BUCKET" \
              --region us-east-1

            aws s3api put-public-access-block \
              --bucket "$BUCKET" \
              --public-access-block-configuration \
              BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          done

      - name: List farhat buckets
        run: aws s3 ls | grep "${PREFIX}"
