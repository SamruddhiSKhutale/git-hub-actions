name: Delete 20 S3 Buckets

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DELETE to confirm"
        required: true

env:
  AWS_REGION: us-east-1
  PREFIX: farhat

jobs:
  delete-buckets:
    if: ${{ github.event.inputs.confirm == 'DELETE' }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Delete 20 buckets (skip if missing)
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          for i in $(seq -w 1 20); do
            BUCKET="${PREFIX}-${ACCOUNT_ID}-${i}"

            if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
              echo "Deleting bucket: $BUCKET"
              aws s3 rb "s3://$BUCKET" --force
            else
              echo "Bucket not found, skipping: $BUCKET"
            fi
          done

      - name: List remaining farhat buckets
        run: aws s3 ls | grep "${PREFIX}" || echo "No farhat buckets left"
